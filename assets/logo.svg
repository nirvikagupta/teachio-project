<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="rsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef3b42"/>
      <stop offset="55%" stop-color="#d7262b"/>
      <stop offset="100%" stop-color="#9e1217"/>
    </linearGradient>
    <linearGradient id="rsRim" x1="0%" y1="0%" x2="100%" y2="100%">
